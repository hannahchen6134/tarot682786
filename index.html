<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大地塔羅｜抽牌</title>
<style>
:root{
 --bg:#ebe4d7;--paper:#f6f0e5;--ink:#493f35;--muted:#827566;
 --olive:#666b50;--olive2:#7a8060;--clay:#a27a60;--line:#cbbdac;
 --shadow:0 18px 45px rgba(61,48,37,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 18% 7%,rgba(255,255,255,.62),transparent 26%),
linear-gradient(180deg,#eee8dd 0%,#e5dccf 100%);color:var(--ink);
font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
body{min-height:100vh}
.wrap{width:min(1180px,100%);margin:0 auto;padding:24px 16px 48px}
header{text-align:center;padding:8px 0 18px}
.eyebrow{font:12px/1.2 system-ui,sans-serif;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(28px,5vw,44px);font-weight:500;letter-spacing:.08em;margin:10px 0 8px}
.sub{font-size:14px;color:var(--muted);line-height:1.8}
.panel{background:rgba(247,242,233,.72);border:1px solid rgba(94,78,62,.18);border-radius:26px;
box-shadow:var(--shadow);backdrop-filter:blur(9px);padding:16px 14px 22px}
.controls{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}
button{border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);
padding:10px 17px;font:14px/1.2 inherit;cursor:pointer;transition:.18s ease}
button:hover{transform:translateY(-1px)}
button.active,button.primary{background:var(--olive);border-color:var(--olive);color:white}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.toggle{font:13px/1.2 system-ui,sans-serif;color:var(--muted);display:flex;align-items:center;gap:7px;padding:0 4px}
.toggle input{accent-color:var(--olive)}
.status{text-align:center;color:var(--muted);font-size:13px;min-height:22px;margin:14px 0 2px}

.fan-wrap{position:relative;height:300px;overflow:hidden;margin-top:8px}
.fan-stage{position:absolute;left:50%;top:18px;width:min(1040px,96vw);height:270px;transform:translateX(-50%)}
.fan-card{position:absolute;left:50%;top:28px;width:82px;height:145px;margin-left:-41px;border:0;background:none;padding:0;border-radius:8px;cursor:pointer;transition:filter .18s ease,translate .18s ease;outline:none;transform-origin:50% 100%}
.fan-card:hover{filter:brightness(1.08);translate:0 -11px}
.fan-card:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
.cardback{position:absolute;inset:0;border-radius:8px;border:1px solid #4f453c;box-shadow:0 5px 14px rgba(50,40,31,.19);
background:
radial-gradient(circle at 50% 50%,transparent 0 18%,#88745e 19% 20%,transparent 21% 34%,#88745e 35% 36%,transparent 37%),
repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 2px,transparent 2px 7px),
#5f654c}
.cardback:before{content:"";position:absolute;inset:7px;border:1px solid rgba(246,235,216,.65);border-radius:5px}
.cardback:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#eee0c9;font-size:23px}
.fan-card.picked{pointer-events:none;opacity:.16}

.result-area{display:none;justify-content:center;gap:24px;flex-wrap:wrap;padding:10px 0 0}
.result-area.show{display:flex}
.result-card{width:min(225px,72vw);text-align:center}
.flip{width:100%;aspect-ratio:300/527;perspective:1300px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.72,.2,1)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:13px;overflow:hidden;backface-visibility:hidden;border:1px solid rgba(73,61,49,.27);
box-shadow:0 16px 32px rgba(55,43,33,.17)}
.face.back{background:
radial-gradient(circle at 50% 50%,transparent 0 18%,#88745e 19% 20%,transparent 21% 34%,#88745e 35% 36%,transparent 37%),
repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 2px,transparent 2px 7px),
#5f654c}
.face.back:before{content:"";position:absolute;inset:11px;border:1px solid rgba(246,235,216,.72);border-radius:7px}
.face.back:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#eee0c9;font-size:35px}
.face.front{transform:rotateY(180deg);background:#e7dfd2}
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.face.front img.reversed{transform:rotate(180deg)}
.img-fallback{display:grid;place-items:center;height:100%;padding:20px;background:#eee7db;color:#796b5d;font-size:13px;line-height:1.7}
.label{min-height:55px;margin-top:10px}
.label strong{display:block;font-size:17px;font-weight:500;letter-spacing:.04em}
.label span{display:block;font:12px/1.4 system-ui,sans-serif;color:var(--muted);margin-top:5px}
.label.hidden{visibility:hidden}
.bottom-actions{display:none;justify-content:center;gap:10px;margin-top:20px}
.bottom-actions.show{display:flex}
.note{text-align:center;color:#9a8c7c;font:11px/1.7 system-ui,sans-serif;margin-top:20px}

@media(max-width:720px){
 .wrap{padding:16px 10px 38px}
 .panel{border-radius:21px;padding:13px 9px 18px}
 .fan-wrap{height:280px}
 .fan-stage{width:96vw;top:14px;height:250px}
 .fan-card{width:72px;height:127px;margin-left:-36px;transform-origin:50% 100%}
 .result-card{width:min(205px,72vw)}
}

.idle-deck{display:grid;place-items:center;height:310px}
.idle-stack{position:relative;width:116px;height:204px;margin-top:8px}
.idle-card{position:absolute;inset:0;border-radius:10px;border:1px solid #4f453c;
background:
radial-gradient(circle at 50% 50%,transparent 0 18%,#88745e 19% 20%,transparent 21% 34%,#88745e 35% 36%,transparent 37%),
repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 2px,transparent 2px 7px),
#5f654c;box-shadow:0 8px 20px rgba(50,40,31,.14)}
.idle-card:before{content:"";position:absolute;inset:8px;border:1px solid rgba(246,235,216,.65);border-radius:6px}
.idle-card:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#eee0c9;font-size:27px}
.idle-card:nth-child(1){transform:translate(-7px,7px) rotate(-2deg)}
.idle-card:nth-child(2){transform:translate(7px,6px) rotate(2deg)}


.fan-stage.is-shuffling .fan-card{pointer-events:none}
.shuffle-note{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font:13px/1.4 system-ui,sans-serif;color:var(--muted);letter-spacing:.08em;
  opacity:0;pointer-events:none;transition:opacity .2s ease
}
.fan-stage.is-shuffling + .shuffle-note{opacity:1}

</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Earth Tarot</div>
  <h1>抽一張牌</h1>
  <div class="sub">把問題放在心裡。洗牌，然後從牌陣裡選擇。</div>
</header>

<main class="panel">
  <div class="controls">
    <button id="one" class="active">抽 1 張</button>
    <button id="three">抽 3 張</button>
    <label class="toggle"><input id="reverse" type="checkbox" checked> 包含逆位</label>
    <button id="shuffle" class="primary">洗牌</button>
  </div>

  <div id="status" class="status">先按「洗牌」。</div>


  <section id="idleDeck" class="idle-deck">
    <div class="idle-stack" aria-hidden="true">
      <div class="idle-card"></div>
      <div class="idle-card"></div>
      <div class="idle-card"></div>
    </div>
  </section>

  <section id="fanWrap" class="fan-wrap" style="display:none">
    <div id="fanStage" class="fan-stage"></div>
    <div class="shuffle-note">洗牌中…</div>
  </section>

  <section id="results" class="result-area"></section>

  <div id="bottomActions" class="bottom-actions">
    <button id="again" class="primary">重新洗牌</button>
  </div>

  <div class="note">Rider–Waite–Smith 1909 公版牌面｜78 張完整牌組</div>
</main>
</div>

<script>
const CARDS = [
{en:'The Fool',zh:'愚者',code:'ar00'},
{en:'The Magician',zh:'魔術師',code:'ar01'},
{en:'The High Priestess',zh:'女祭司',code:'ar02'},
{en:'The Empress',zh:'皇后',code:'ar03'},
{en:'The Emperor',zh:'皇帝',code:'ar04'},
{en:'The Hierophant',zh:'教皇',code:'ar05'},
{en:'The Lovers',zh:'戀人',code:'ar06'},
{en:'The Chariot',zh:'戰車',code:'ar07'},
{en:'Strength',zh:'力量',code:'ar08'},
{en:'The Hermit',zh:'隱者',code:'ar09'},
{en:'Wheel of Fortune',zh:'命運之輪',code:'ar10'},
{en:'Justice',zh:'正義',code:'ar11'},
{en:'The Hanged Man',zh:'吊人',code:'ar12'},
{en:'Death',zh:'死神',code:'ar13'},
{en:'Temperance',zh:'節制',code:'ar14'},
{en:'The Devil',zh:'惡魔',code:'ar15'},
{en:'The Tower',zh:'高塔',code:'ar16'},
{en:'The Star',zh:'星星',code:'ar17'},
{en:'The Moon',zh:'月亮',code:'ar18'},
{en:'The Sun',zh:'太陽',code:'ar19'},
{en:'Judgement',zh:'審判',code:'ar20'},
{en:'The World',zh:'世界',code:'ar21'},
{en:'Ace of Wands',zh:'權杖王牌',code:'wa01'},
{en:'Two of Wands',zh:'權杖二',code:'wa02'},
{en:'Three of Wands',zh:'權杖三',code:'wa03'},
{en:'Four of Wands',zh:'權杖四',code:'wa04'},
{en:'Five of Wands',zh:'權杖五',code:'wa05'},
{en:'Six of Wands',zh:'權杖六',code:'wa06'},
{en:'Seven of Wands',zh:'權杖七',code:'wa07'},
{en:'Eight of Wands',zh:'權杖八',code:'wa08'},
{en:'Nine of Wands',zh:'權杖九',code:'wa09'},
{en:'Ten of Wands',zh:'權杖十',code:'wa10'},
{en:'Page of Wands',zh:'權杖侍者',code:'wa11'},
{en:'Knight of Wands',zh:'權杖騎士',code:'wa12'},
{en:'Queen of Wands',zh:'權杖皇后',code:'wa13'},
{en:'King of Wands',zh:'權杖國王',code:'wa14'},
{en:'Ace of Cups',zh:'聖杯王牌',code:'cu01'},
{en:'Two of Cups',zh:'聖杯二',code:'cu02'},
{en:'Three of Cups',zh:'聖杯三',code:'cu03'},
{en:'Four of Cups',zh:'聖杯四',code:'cu04'},
{en:'Five of Cups',zh:'聖杯五',code:'cu05'},
{en:'Six of Cups',zh:'聖杯六',code:'cu06'},
{en:'Seven of Cups',zh:'聖杯七',code:'cu07'},
{en:'Eight of Cups',zh:'聖杯八',code:'cu08'},
{en:'Nine of Cups',zh:'聖杯九',code:'cu09'},
{en:'Ten of Cups',zh:'聖杯十',code:'cu10'},
{en:'Page of Cups',zh:'聖杯侍者',code:'cu11'},
{en:'Knight of Cups',zh:'聖杯騎士',code:'cu12'},
{en:'Queen of Cups',zh:'聖杯皇后',code:'cu13'},
{en:'King of Cups',zh:'聖杯國王',code:'cu14'},
{en:'Ace of Swords',zh:'寶劍王牌',code:'sw01'},
{en:'Two of Swords',zh:'寶劍二',code:'sw02'},
{en:'Three of Swords',zh:'寶劍三',code:'sw03'},
{en:'Four of Swords',zh:'寶劍四',code:'sw04'},
{en:'Five of Swords',zh:'寶劍五',code:'sw05'},
{en:'Six of Swords',zh:'寶劍六',code:'sw06'},
{en:'Seven of Swords',zh:'寶劍七',code:'sw07'},
{en:'Eight of Swords',zh:'寶劍八',code:'sw08'},
{en:'Nine of Swords',zh:'寶劍九',code:'sw09'},
{en:'Ten of Swords',zh:'寶劍十',code:'sw10'},
{en:'Page of Swords',zh:'寶劍侍者',code:'sw11'},
{en:'Knight of Swords',zh:'寶劍騎士',code:'sw12'},
{en:'Queen of Swords',zh:'寶劍皇后',code:'sw13'},
{en:'King of Swords',zh:'寶劍國王',code:'sw14'},
{en:'Ace of Pentacles',zh:'錢幣王牌',code:'pe01'},
{en:'Two of Pentacles',zh:'錢幣二',code:'pe02'},
{en:'Three of Pentacles',zh:'錢幣三',code:'pe03'},
{en:'Four of Pentacles',zh:'錢幣四',code:'pe04'},
{en:'Five of Pentacles',zh:'錢幣五',code:'pe05'},
{en:'Six of Pentacles',zh:'錢幣六',code:'pe06'},
{en:'Seven of Pentacles',zh:'錢幣七',code:'pe07'},
{en:'Eight of Pentacles',zh:'錢幣八',code:'pe08'},
{en:'Nine of Pentacles',zh:'錢幣九',code:'pe09'},
{en:'Ten of Pentacles',zh:'錢幣十',code:'pe10'},
{en:'Page of Pentacles',zh:'錢幣侍者',code:'pe11'},
{en:'Knight of Pentacles',zh:'錢幣騎士',code:'pe12'},
{en:'Queen of Pentacles',zh:'錢幣皇后',code:'pe13'},
{en:'King of Pentacles',zh:'錢幣國王',code:'pe14'}
];
const IMG_BASE="https://raw.githubusercontent.com/sixseeds/tarot-api/main/cards/";
let order=[...CARDS];
let drawCount=1;
let selected=[];
let shuffled=false;

const $=s=>document.querySelector(s);

function fy(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function setMode(n){
  drawCount=n;
  $("#one").classList.toggle("active",n===1);
  $("#three").classList.toggle("active",n===3);
  selected=[];
  shuffled=false;
  $("#results").innerHTML="";
  $("#results").classList.remove("show");
  $("#bottomActions").classList.remove("show");
  $("#fanWrap").style.display="none";
  $("#idleDeck").style.display="grid";
  $("#status").textContent="先按「洗牌」。";
}
$("#one").onclick=()=>setMode(1);
$("#three").onclick=()=>setMode(3);

function renderFan(animate=true){
  const stage=$("#fanStage");
  stage.innerHTML="";
  const total=order.length;
  order.forEach((card,i)=>{
    const btn=document.createElement("button");
    btn.className="fan-card";
    btn.type="button";
    btn.setAttribute("aria-label",`第 ${i+1} 張牌`);
    const t=i/(total-1);
    const x=(t-.5)*Math.min(900, window.innerWidth*0.82);
    const angle=(t-.5)*18;
    const curve=Math.pow((t-.5)*2,2)*48;
    btn.style.transform=`translateX(${x}px) translateY(${curve}px) rotate(${angle}deg)`;
    btn.style.zIndex=i+1;
    if(animate){
      btn.animate(
        [{opacity:0,transform:`translateX(0px) translateY(110px) rotate(0deg)`},
         {opacity:1,transform:`translateX(${x}px) translateY(${curve}px) rotate(${angle}deg)`}],
        {duration:420+Math.min(i*6,320),easing:"cubic-bezier(.2,.75,.2,1)",fill:"both"}
      );
    }
    btn.innerHTML='<div class="cardback"></div>';
    btn.onclick=()=>pick(i,btn);
    stage.appendChild(btn);
  });
}

async function shuffleDeck(){
  selected=[];
  shuffled=false;
  $("#results").innerHTML="";
  $("#results").classList.remove("show");
  $("#bottomActions").classList.remove("show");
  $("#idleDeck").style.display="none";
  $("#fanWrap").style.display="block";
  $("#status").textContent="洗牌中…";

  // 先讓目前牌組收回中央
  if(!$("#fanStage").children.length){
    renderFan(false);
  }
  const stage=$("#fanStage");
  stage.classList.add("is-shuffling");
  const cards=[...stage.querySelectorAll(".fan-card")];

  await Promise.all(cards.map((el,i)=>
    el.animate(
      [
        {transform:getComputedStyle(el).transform,opacity:1},
        {transform:`translateX(0px) translateY(70px) rotate(${(i%2?3:-3)}deg)`,opacity:.95}
      ],
      {duration:320,easing:"cubic-bezier(.3,.7,.2,1)",fill:"forwards"}
    ).finished.catch(()=>{})
  ));

  // 左右交錯洗動三次
  for(let round=0;round<3;round++){
    await Promise.all(cards.map((el,i)=>{
      const side=(i%2===0?-1:1);
      const depth=(i%7)*2;
      return el.animate(
        [
          {transform:`translateX(0px) translateY(70px) rotate(0deg)`},
          {transform:`translateX(${side*(70+depth)}px) translateY(${40+(i%5)*3}px) rotate(${side*(7+(i%4))}deg)`},
          {transform:`translateX(${side*(18+depth/2)}px) translateY(${58+(i%3)*4}px) rotate(${side*2}deg)`},
          {transform:`translateX(0px) translateY(70px) rotate(0deg)`}
        ],
        {duration:420,delay:(i%6)*5,easing:"ease-in-out",fill:"forwards"}
      ).finished.catch(()=>{});
    }));
  }

  // 真正打亂資料順序
  order=fy(CARDS);

  // 用新順序重新建立，再展開
  renderFan(false);
  const newCards=[...stage.querySelectorAll(".fan-card")];
  newCards.forEach(el=>{
    el.style.opacity="0";
    el.style.transform="translateX(0px) translateY(70px) rotate(0deg)";
  });

  await new Promise(r=>setTimeout(r,80));

  const total=order.length;
  newCards.forEach((el,i)=>{
    const t=i/(total-1);
    const x=(t-.5)*Math.min(900, window.innerWidth*0.82);
    const angle=(t-.5)*18;
    const curve=Math.pow((t-.5)*2,2)*48;
    el.animate(
      [
        {opacity:0,transform:"translateX(0px) translateY(70px) rotate(0deg)"},
        {opacity:1,transform:`translateX(${x}px) translateY(${curve}px) rotate(${angle}deg)`}
      ],
      {duration:520,delay:Math.min(i*5,240),easing:"cubic-bezier(.2,.75,.2,1)",fill:"forwards"}
    );
    el.style.opacity="1";
    el.style.transform=`translateX(${x}px) translateY(${curve}px) rotate(${angle}deg)`;
  });

  await new Promise(r=>setTimeout(r,800));
  stage.classList.remove("is-shuffling");
  shuffled=true;
  $("#status").textContent=drawCount===1 ? "洗好了。從展開的牌陣中選 1 張。" : "洗好了。從展開的牌陣中選 3 張。";
}
$("#shuffle").onclick=shuffleDeck;
$("#again").onclick=shuffleDeck;

function pick(index,btn){
  if(!shuffled){
    $("#status").textContent="請先洗牌，再抽牌。";
    return;
  }
  if(btn.classList.contains("picked") || selected.length>=drawCount) return;
  btn.classList.add("picked");
  selected.push(order[index]);

  if(selected.length<drawCount){
    $("#status").textContent=`已選 ${selected.length} 張，還要選 ${drawCount-selected.length} 張。`;
    return;
  }
  showResults();
}

function showResults(){
  $("#status").textContent="點牌背翻牌。";
  $("#fanWrap").style.display="none";
  $("#idleDeck").style.display="none";
  const area=$("#results");
  area.innerHTML="";
  const reverseOn=$("#reverse").checked;

  selected.forEach((card,i)=>{
    const rev=reverseOn && Math.random()<0.5;
    const labelPrefix=drawCount===3 ? ["過去","現在","未來"][i]+" · " : "";
    const box=document.createElement("div");
    box.className="result-card";
    const raw=IMG_BASE+card.code+".jpg";
    box.innerHTML=`
      <div class="flip" tabindex="0" role="button" aria-label="翻牌">
        <div class="flip-inner">
          <div class="face back"></div>
          <div class="face front">
            <img src="${raw}" alt="${card.zh}" class="${rev?"reversed":""}">
          </div>
        </div>
      </div>
      <div class="label hidden"><strong>${card.zh}</strong><span>${labelPrefix}${rev?"逆位":"正位"}</span></div>`;
    const flip=box.querySelector(".flip");
    const label=box.querySelector(".label");
    const img=box.querySelector("img");

    img.onerror=()=>{
      const front=box.querySelector(".face.front");
      front.innerHTML='<div class="img-fallback">牌面圖片暫時無法載入<br>請用一般 Chrome / Safari 開啟此檔案</div>';
    };

    const reveal=()=>{
      if(flip.classList.contains("flipped"))return;
      flip.classList.add("flipped");
      label.classList.remove("hidden");
      const flips=[...document.querySelectorAll(".flip")];
      if(flips.length && flips.every(x=>x.classList.contains("flipped"))){
        $("#bottomActions").classList.add("show");
        $("#status").textContent="抽牌完成。";
      }
    };
    flip.onclick=reveal;
    flip.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal()}};
    area.appendChild(box);
  });
  area.classList.add("show");
}

</script>
</body>
</html>
